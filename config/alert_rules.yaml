alerts:
  - name: HighP95Latency
    severity: critical
    condition: latency_p95_ms > 3000
    duration: 5m
    type: symptom-based
    owner: TranVietTruong
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    owner: TranVietTruong
    runbook: docs/alerts.md#alert-2
  - name: LowQualityScore
    severity: warning
    condition: quality_score_avg < 0.75
    duration: 10m
    type: symptom-based
    owner: TranVietTruong
    runbook: docs/alerts.md#alert-3
