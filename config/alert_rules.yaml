alerts:
  - name: High chat latency
    severity: warning
    condition: latency_p95_ms > 3000 for 5m
    type: symptom-based
    owner: Tran Viet Truong (2A202601467)
    runbook: docs/alerts.md#alert-1
  - name: Elevated request error rate
    severity: critical
    condition: error_rate_pct > 2 for 5m and request_count >= 20
    type: symptom-based
    owner: Tran Viet Truong (2A202601467)
    runbook: docs/alerts.md#alert-2
  - name: Quality proxy degradation
    severity: warning
    condition: quality_score_avg < 0.75 for 15m and response_count >= 20
    type: symptom-based
    owner: Tran Viet Truong (2A202601467)
    runbook: docs/alerts.md#alert-3
